# This is an OpenEMPIRE configuration file used for test runs.
# To be used with the execution script run.py


emission_cap: False                                # Indicates if there's a cap on CO2 emissions
cvar: False
natural_gas: False
gas_stochasticity: False
hydrogen: False
transport: False
heat: False
industry: False
north_sea: True
offshore_converters: False
industry_flexibility_flag: False


use_temporary_directory: True                          # Specifies whether to use a temporary directory for operations
temporary_directory: './'                              # Path to the temporary directory used for certain operations
forecast_horizon_year: 2035                            # Target or end year for the run
number_of_scenarios: 2                                 # Number of scenarios in every investment period
length_regular_season: 24                           # Number of hours in a regular season
regular_seasons: ['winter', 'spring']
discount_rate: 0.05                                    # Rate used to discount future cash flows to present value
wacc: 0.05                                             # Weighted average cost of capital
optimization_solver: "Gurobi"                          # Mathematical solver used for optimization tasks
fixed_sampling_key_flag: False                         # Specifies if a sampling key should be used to select scenarios
fixed_csv_sample_flag: False                           # Specifies if explicitly supplied fixed scenarios should be used
filter_make : False                                    #
filter_use : False                                     #
copula_clusters_make: False                            # Make copula clusters (for copula-strata SGR)
copula_clusters_use: False                             # Copula-based scenario generation (strata/filter approach)
copulas_to_use: ["electricload"]                       # Emprical copula construction of ["electricload", "hydroror", "hydroseasonal", "solar", "windoffshore", "windonshore"]
n_cluster : 10                                         #
moment_matching : False                                #
n_tree_compare : 20                                    # Number of trees to compare for moment matching and copula-sampling

compute_operational_duals_flag: False                        # Resolve empire with fixed investment variables and write new duals
print_iamc_flag: True                             # Output should be printed in a IAMC-compatible format
write_in_lp_format: False                              # Problem should be written in Linear Programming format
serialize_instance: False                              # Serialize the data structure or model for later use
north_sea_flag: False                                       # Whether the north sea is modelled or not
leap_years_investment: 5                               # Number of years per period (default: 5)
time_format: "%d/%m/%Y %H:%M"                          # Time format for scenario data files

benders_flag: False                   # Whether to use Benders decompsition 
max_benders_iterations: 50
include_hydro_node_limit_constraint_flag: False
parallel_benders_flag: False
n_cores: 2


cvar_percentile: 0.95
cvar_weight: 0.0

industry_flexibility_flag: False
steel_CCS_capture_rate: 
steel_CCS_cost_increase: 

gas_h2_repurpose_cost_factor: 0.25
repurposeEnergyFlowFactor: 0.8

use_default_timeseries_source: False
